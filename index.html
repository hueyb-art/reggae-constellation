<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>The Reggae Constellation — an encyclopedia of who shaped whom</title>
<style>
  :root{
    /* deep-green "space". To dial it lighter/darker, edit --bg (base) and --glow (top glow). */
    --bg:#07331c; --glow:#1a5e38; --panel:rgba(10,31,19,0.94); --ink:#f3ece0; --soft:#b6aaa0;
    --muted:#8d8378; --gold:#e0b15a; --line:rgba(224,177,90,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1100px 760px at 72% -8%, var(--glow) 0%, rgba(4,20,11,0) 60%), radial-gradient(1500px 1100px at 50% 130%, #041e10 0%, var(--bg) 70%);
    color:var(--ink); font-family:"Helvetica Neue",Arial,sans-serif; overflow:hidden;
  }
  #stage{position:fixed;inset:0}
  canvas{display:block}

  .topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:18px;padding:16px 22px;pointer-events:none;z-index:5}
  .brand{pointer-events:auto}
  .brand h1{font-size:19px;font-weight:600;letter-spacing:.04em}
  .brand .tag{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:3px}
  .ver{font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.05em;vertical-align:middle}
  .search{pointer-events:auto;margin-left:auto;position:relative}
  .search input{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:999px;color:var(--ink);font-size:13px;padding:9px 16px;width:230px;outline:none;transition:border-color .2s,background .2s}
  .search input:focus{border-color:var(--gold);background:rgba(255,255,255,.08)}
  .search input::placeholder{color:var(--muted)}
  .suggest{position:absolute;top:42px;right:0;width:250px;background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden;backdrop-filter:blur(8px);box-shadow:0 18px 50px rgba(0,0,0,.55);display:none}
  .suggest div{padding:9px 14px;font-size:13px;cursor:pointer;color:var(--soft)}
  .suggest div:hover,.suggest div.active{background:rgba(224,177,90,.14);color:var(--ink)}

  .legend{position:fixed;left:22px;bottom:20px;z-index:5;display:flex;flex-direction:column;gap:7px;background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:13px 15px;backdrop-filter:blur(8px)}
  .legend .lh{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .legend label{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--soft);cursor:pointer;user-select:none}
  .legend .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .legend label.off{opacity:.4}

  .hint{position:fixed;right:22px;bottom:20px;z-index:5;font-size:11.5px;color:var(--muted);text-align:right;line-height:1.7;background:var(--panel);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px)}
  .hint b{color:var(--soft);font-weight:600}
  .spread{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:9px 16px;backdrop-filter:blur(8px)}
  .spread span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .spread input[type=range]{width:150px;accent-color:var(--gold);cursor:pointer}
  .clipnote{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:9;background:var(--panel);border:1px solid rgba(224,177,90,.4);color:var(--gold);font-size:12.5px;padding:7px 16px;border-radius:999px;backdrop-filter:blur(8px);opacity:0;transition:opacity .3s;pointer-events:none;max-width:80%;text-align:center}
  .clipnote.show{opacity:1}

  .panel{position:fixed;top:0;right:0;height:100%;width:360px;background:var(--panel);border-left:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:8;padding:26px 26px 30px;overflow-y:auto}
  .panel.open{transform:translateX(0)}
  .panel .close{position:absolute;top:18px;right:18px;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;background:none;border:none}
  .panel .close:hover{color:var(--ink)}
  .pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:4px 11px;border-radius:999px;margin-bottom:14px;font-weight:600}
  .panel h2{font-size:25px;font-weight:600;line-height:1.15;margin-bottom:4px}
  .panel .role{font-size:13px;color:var(--gold);margin-bottom:4px}
  .panel .life{font-size:12px;color:var(--muted);margin-bottom:16px}
  .panel .bio{font-size:14px;line-height:1.6;color:var(--soft);margin-bottom:18px}
  .openpage{display:inline-flex;align-items:center;gap:8px;background:rgba(224,177,90,.14);border:1px solid rgba(224,177,90,.35);color:var(--gold);font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer;transition:background .2s}
  .openpage:hover{background:rgba(224,177,90,.24)}
  .sec{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:20px 0 9px}
  .conns{display:flex;flex-direction:column;gap:5px}
  .conn{display:flex;align-items:baseline;gap:9px;font-size:13px;cursor:pointer;padding:5px 8px;border-radius:8px;color:var(--soft)}
  .conn:hover{background:rgba(224,177,90,.12);color:var(--ink)}
  .conn .rel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:90px}
  .conn .nm{font-weight:500}

  /* full encyclopedia page */
  .page{position:fixed;inset:0;z-index:20;background:radial-gradient(1000px 700px at 78% -8%, var(--glow) 0%, var(--bg) 58%);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .35s}
  .page.open{opacity:1;pointer-events:auto}
  .page-inner{max-width:820px;margin:0 auto;padding:34px 28px 90px}
  .back{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid rgba(255,255,255,.16);color:var(--soft);font-size:13px;padding:8px 15px;border-radius:999px;cursor:pointer;margin-bottom:30px;transition:border-color .2s,color .2s}
  .back:hover{border-color:var(--gold);color:var(--ink)}
  .page h1{font-size:46px;font-weight:600;line-height:1.05;letter-spacing:-.01em;margin:10px 0 8px}
  .page .prole{font-size:15px;color:var(--gold);margin-bottom:3px}
  .page .plife{font-size:13.5px;color:var(--muted);margin-bottom:26px}
  .page .pbio{font-size:17px;line-height:1.72;color:#ddd3c6;max-width:680px;margin-bottom:8px}
  .phead{display:flex;gap:22px;align-items:center;margin-bottom:10px}
  .pavatar{width:104px;height:104px;border-radius:16px;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600;color:#0c0a0d}
  .pavatar.hasimg{color:transparent}
  .pavatar img{width:100%;height:100%;object-fit:cover;display:block}
  .pavcol{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none}
  .pcredit{font-size:10px;color:var(--muted);text-decoration:none;opacity:0;transition:opacity .3s}
  .pcredit.show{opacity:1}
  .pcredit:hover{color:var(--gold)}
  .pheadtext{min-width:0}
  .phead h1{margin:6px 0 6px}
  .page h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:40px 0 16px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:10px}
  .disco{display:flex;flex-direction:column;gap:2px}
  .drow{display:flex;gap:18px;align-items:baseline;padding:11px 8px;border-radius:8px}
  .drow:hover{background:rgba(255,255,255,.03)}
  .dyear{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:13px;color:var(--gold);min-width:74px;flex:none}
  .dtitle{font-size:15.5px;color:var(--ink);font-weight:500}
  .dnote{font-size:13px;color:var(--muted);margin-left:6px}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--soft);cursor:pointer;transition:background .2s,border-color .2s}
  .chip:hover{background:rgba(224,177,90,.14);border-color:rgba(224,177,90,.4);color:var(--ink)}
  .chip .cd{width:9px;height:9px;border-radius:50%;flex:none}
  .chip .cr{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .discoloading{font-size:14px;color:var(--muted);padding:8px 0}
  .discometa{font-size:12px;color:var(--muted);margin-bottom:10px}
  .dtag{font-size:10.5px;color:var(--muted);margin-left:8px;border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:1px 6px;text-transform:uppercase;letter-spacing:.04em}
  .moreBtn{margin-top:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:var(--soft);font-size:13px;padding:9px 16px;border-radius:10px;cursor:pointer}
  .moreBtn:hover{border-color:var(--gold);color:var(--ink)}
  .dmain{display:inline}
  .svc{display:inline-flex;gap:6px;margin-left:10px;vertical-align:middle}
  .svc a{font-size:11px;color:var(--muted);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:1px 7px;text-decoration:none;transition:color .2s,border-color .2s}
  .svc a:hover{color:var(--gold);border-color:var(--gold)}
  @media(max-width:700px){.drow .dmain{display:flex;flex-direction:column;align-items:flex-start;gap:5px}.svc{margin-left:0}}
  .reslist{display:flex;flex-direction:column;gap:8px;max-width:680px}
  .reslink{display:flex;align-items:baseline;gap:12px;text-decoration:none;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 16px;transition:border-color .2s,background .2s}
  .reslink:hover{border-color:var(--gold);background:rgba(224,177,90,.1)}
  .reslink .rt{color:var(--ink);font-size:15px;font-weight:500}
  .reslink .rn{color:var(--muted);font-size:13px;flex:1}
  .reslink .ra{color:var(--gold);font-size:14px}
  .brow{padding:9px 8px;border-radius:8px}
  .brow:hover{background:rgba(255,255,255,.03)}
  .btitle{font-size:15px;color:var(--ink);font-style:italic}
  .bmeta{font-size:13px;color:var(--muted)}
  .rr{pointer-events:auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:var(--soft);font-size:12.5px;padding:8px 14px;border-radius:999px;cursor:pointer;transition:border-color .2s,color .2s}
  .rr:hover{border-color:var(--gold);color:var(--ink)}
  .rr.on{border-color:var(--gold);color:var(--gold)}
  .instr{pointer-events:auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:var(--soft);font-size:12.5px;padding:8px 12px;border-radius:999px;cursor:pointer;outline:none}
  .instr:focus{border-color:var(--gold)}
  .instr option{background:#15121a;color:var(--ink)}
  .lead{font-size:17px;line-height:1.7;color:#ddd3c6;max-width:680px;margin-bottom:18px}
  .critic{margin-bottom:24px}
  .critic h4{font-size:18px;font-weight:600;color:var(--ink);margin-bottom:2px}
  .critic .cnote{font-size:13px;color:var(--gold);margin-bottom:8px}
  @media(max-width:560px){.page h1{font-size:34px}.page-inner{padding:24px 18px 70px}}
  #stage,canvas{touch-action:none}
  @media(max-width:700px){
    .topbar{flex-wrap:wrap;gap:8px;padding:10px 12px}
    .brand h1{font-size:15px}
    .brand .tag{display:none}
    .rr{font-size:11.5px;padding:6px 10px}
    .instr{font-size:11.5px;padding:6px 9px}
    .search{margin-left:auto}
    .search input{width:140px}
    .suggest{width:200px}
    .hint{display:none}
    .legend{left:12px;bottom:12px;padding:8px 10px;gap:4px;border-radius:12px}
    .legend .lh{font-size:9.5px}
    .legend label{font-size:11px;gap:7px}
    .legend .dot{width:9px;height:9px}
    .spread{left:auto;right:12px;bottom:12px;transform:none;padding:7px 11px;gap:7px}
    .spread input[type=range]{width:92px}
    .spread span{font-size:9.5px}
    .panel{width:100%;height:auto;max-height:50%;top:auto;bottom:0;left:0;border-left:none;border-top:1px solid rgba(255,255,255,.12);border-radius:18px 18px 0 0;transform:translateY(100%);padding:20px 22px 24px}
    .panel.open{transform:translateY(0)}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="topbar">
  <div class="brand">
    <h1>The Reggae Constellation <span class="ver">v7</span></h1>
    <div class="tag">An encyclopedia of who shaped whom</div>
  </div>
  <button class="rr" id="rrBtn">Reading room</button>
  <button class="rr" id="fitBtn">Fit to screen</button>
  <select class="instr" id="instr" aria-label="Filter by instrument"><option value="">All instruments</option></select>
  <div class="search">
    <input id="q" type="text" placeholder="Find a musician…" autocomplete="off" />
    <div class="suggest" id="suggest"></div>
  </div>
</div>

<div class="legend" id="legend"></div>
<div class="hint"><b>Hover</b> to trace ties &middot; <b>Click</b> for a card &middot; <b>Double-click</b> for the full page<br><b>Drag</b> to spin the globe &middot; <b>Scroll</b> to zoom</div>
<div class="spread"><span>Tight</span><input id="spread" type="range" min="0.7" max="3.4" step="0.05" value="1.5" aria-label="Spread the network out" /><span>Spread</span></div>
<div id="clipnote" class="clipnote"></div>

<aside class="panel" id="panel"><button class="close" id="close">&times;</button><div id="panelBody"></div></aside>
<div class="page" id="page"><div class="page-inner" id="pageInner"></div></div>

<script>
const ERAS={
  ska:{label:"Ska & foundations",color:"#e0b15a"},
  rocksteady:{label:"Rocksteady",color:"#d98c3f"},
  roots:{label:"Roots reggae",color:"#3faf5a"},
  dub:{label:"Dub & production",color:"#4f93d8"},
  dancehall:{label:"Dancehall",color:"#d9607a"},
  digital:{label:"Digital & ragga",color:"#9b7fd4"},
  contemporary:{label:"Contemporary",color:"#cf7bbf"},
};
function n(id,name,era,role,life,blurb,bio,disco){return{id,name,era,role,life,blurb,bio,disco};}
const NODES=[
n("coxsone","Clement \"Coxsone\" Dodd","ska","Producer · Studio One","1932–2004 · Jamaican","Founder of Studio One, reggae's Motown.","The visionary sound-system man and producer whose Studio One was the cradle of ska, rocksteady, and roots, recording nearly every great early Jamaican artist.",[["1960s","Studio One foundation sides",""]]),
n("dukereid","Duke Reid","ska","Producer · Treasure Isle","1915–1975 · Jamaican","'The Trojan' of Treasure Isle.","A former policeman turned sound-system king and producer whose Treasure Isle studio defined the lush sound of rocksteady.",[["1967","Treasure Isle rocksteady sides",""]]),
n("princebuster","Prince Buster","ska","Vocals · producer","1938–2016 · Jamaican","Ska's defiant pioneer.","A singer, producer, and sound-system rebel whose hits like 'Al Capone' and 'Madness' shaped ska and inspired the British 2 Tone movement.",[["1967","Fabulous Greatest Hits",""]]),
n("skatalites","The Skatalites","ska","Band","est.1964 · Jamaican","The instrumental engine of ska.","Jamaica's greatest instrumental band, a powerhouse of jazz-trained players who cut the foundational ska of the 1960s at Studio One.",[["1965","Ska Authentic",""]]),
n("dondrummond","Don Drummond","ska","Trombone","1932–1969 · Jamaican","Ska's tragic trombone genius.","A brilliant, troubled trombonist of the Skatalites whose haunting melodies are among ska's deepest music.",[["1965","with the Skatalites",""]]),
n("tommymccook","Tommy McCook","ska","Saxophone","1927–1998 · Jamaican","Reed-man and bandleader of ska.","A jazz-rooted tenor saxophonist who co-founded the Skatalites and led Treasure Isle's Supersonics through the rocksteady era.",[["1965","with the Skatalites",""]]),
n("rolandalphonso","Roland Alphonso","ska","Saxophone","1931–1998 · Jamaican","'The Chief Musician' of ska.","A foundational tenor saxophonist of the Skatalites and Studio One, one of the most recorded players in Jamaican music.",[["1965","with the Skatalites",""]]),
n("ernestranglin","Ernest Ranglin","ska","Guitar","b.1932 · Jamaican","The guitarist who shaped the Jamaican sound.","A jazz-schooled guitarist whose arrangements (including 'My Boy Lollipop') and playing underpinned ska's birth and decades of Jamaican music.",[["1964","Wranglin",""]]),
n("desmonddekker","Desmond Dekker","ska","Vocals","1941–2006 · Jamaican","Ska's first international star.","The singer whose 'Israelites' became the first Jamaican song to top the UK charts, carrying ska and rocksteady to the world.",[["1969","Israelites",""]]),
n("derrickmorgan","Derrick Morgan","ska","Vocals","b.1940 · Jamaican","Ska's hit-making everyman.","A dominant singer of the ska era whose string of hits and famous rivalry with Prince Buster lit up Jamaican music.",[["1969","Moon Hop",""]]),
n("laurelaitken","Laurel Aitken","ska","Vocals","1927–2005 · Cuban-Jamaican","'The Godfather of Ska.'","A pioneering singer, born in Cuba, whose early recordings helped launch Jamaican popular music and British ska.",[["1960","Boogie in My Bones",""]]),
n("milliesmall","Millie Small","ska","Vocals","1947–2020 · Jamaican","Ska's global breakthrough voice.","The singer whose 1964 'My Boy Lollipop' became a worldwide smash and introduced ska to a mass audience.",[["1964","My Boy Lollipop",""]]),
n("byronlee","Byron Lee","ska","Bass · bandleader","1934–2008 · Jamaican","Bandleader who took ska uptown.","A bassist and bandleader whose Dragonaires brought ska to international stages and who became a major industry figure.",[["1964","Jamaica Ska",""]]),
n("jimmycliff","Jimmy Cliff","roots","Vocals","b.1948 · Jamaican","The face of reggae's rise.","A singer, songwriter, and star of 'The Harder They Come,' the film and soundtrack that introduced reggae to the world.",[["1972","The Harder They Come",""],["1969","Wonderful World, Beautiful People",""]]),
n("tootshibbert","Toots Hibbert","roots","Vocals","1942–2020 · Jamaican","The man who named reggae.","The gospel-fired voice of Toots and the Maytals, whose 1968 'Do the Reggay' gave the music its name.",[["1973","Funky Kingston",""]]),
n("altonellis","Alton Ellis","rocksteady","Vocals","1938–2008 · Jamaican","'The Godfather of Rocksteady.'","A singer of aching tenderness whose 'Get Ready – Rock Steady' helped name and define the rocksteady era.",[["1967","Mr. Soul of Jamaica",""]]),
n("kenboothe","Ken Boothe","rocksteady","Vocals","b.1948 · Jamaican","Rocksteady's soulful tenor.","A powerful, soul-influenced singer whose 'Everything I Own' topped the UK charts and who remains a rocksteady giant.",[["1971","Mr. Rock Steady",""]]),
n("johnholt","John Holt","rocksteady","Vocals","1947–2014 · Jamaican","Velvet voice of the Paragons.","The lead singer of the Paragons ('The Tide Is High') and a beloved solo balladeer across rocksteady and reggae.",[["1973","1000 Volts of Holt",""]]),
n("theparagons","The Paragons","rocksteady","Band","est.1964 · Jamaican","Harmony kings of rocksteady.","A close-harmony vocal trio, led by John Holt, whose 'The Tide Is High' became a global standard.",[["1967","On the Beach",""]]),
n("heptones","The Heptones","rocksteady","Band","est.1965 · Jamaican","Studio One's harmony masters.","A revered vocal trio, anchored by Leroy Sibbles, whose harmonies defined the Studio One sound of rocksteady and roots.",[["1976","Night Food",""]]),
n("leroysibbles","Leroy Sibbles","rocksteady","Vocals · bass","b.1949 · Jamaican","Voice and bass of Studio One.","The lead Heptone and Studio One's house bassist, whose basslines underpin countless classic riddims.",[["1982","Mean While",""]]),
n("delroywilson","Delroy Wilson","rocksteady","Vocals","1948–1995 · Jamaican","Child star turned rocksteady great.","A singer who began as a child at Studio One and matured into one of rocksteady and reggae's most loved voices.",[["1976","Sarge",""]]),
n("phyllisdillon","Phyllis Dillon","rocksteady","Vocals","1944–2004 · Jamaican","'The Queen of Rocksteady.'","Treasure Isle's leading female voice, whose cool, elegant singing graced some of rocksteady's finest sides.",[["1967","One Life to Live",""]]),
n("hoptonlewis","Hopeton Lewis","rocksteady","Vocals","1947–2014 · Jamaican","Helped slow ska into rocksteady.","A singer whose relaxed 1966 'Take It Easy' is often cited as a first rocksteady record.",[["1970","Grooving Out on Life",""]]),
n("bobandy","Bob Andy","rocksteady","Vocals · songwriter","1944–2020 · Jamaican","Reggae's great songwriter.","A profound singer-songwriter (Studio One, Bob & Marcia) whose compositions are pillars of the Jamaican songbook.",[["1970","Song Book",""]]),
n("marciagriffiths","Marcia Griffiths","roots","Vocals","b.1949 · Jamaican","'The Empress of Reggae.'","A singer from Studio One and Bob & Marcia who became an I-Three behind Bob Marley and a beloved solo star.",[["1978","Naturally",""]]),
n("slimsmith","Slim Smith","rocksteady","Vocals","1948–1973 · Jamaican","A voice of fragile beauty.","The soaring lead of the Techniques and the Uniques, whose intense singing influenced a generation before his early death.",[["1968","Born to Love",""]]),
n("kingtubby","King Tubby","dub","Engineer · dub pioneer","1941–1989 · Jamaican","The inventor of dub.","An electronics genius whose remixing at the mixing desk — drop-outs, reverb, echo — created dub and reshaped modern music.",[["1976","King Tubbys Meets Rockers Uptown",""]]),
n("leeperry","Lee \"Scratch\" Perry","dub","Producer · Black Ark","1936–2021 · Jamaican","Reggae's mad genius producer.","The visionary, eccentric producer of the Black Ark studio whose surreal soundscapes shaped roots, dub, and the early Wailers.",[["1976","Super Ape",""]]),
n("bunnylee","Bunny \"Striker\" Lee","dub","Producer","1941–2020 · Jamaican","The hit-flying producer.","A prolific, influential producer who pioneered the 'flying cymbal' sound and worked with King Tubby and countless singers.",[["1970s","Bunny Lee productions",""]]),
n("niney","Niney the Observer","dub","Producer","b.1944 · Jamaican","Roots producer of 'Blood and Fire.'","A producer and singer whose stark, militant roots productions (and Dennis Brown work) defined 1970s reggae.",[["1973","Blood and Fire",""]]),
n("joegibbs","Joe Gibbs","dub","Producer","1942–2008 · Jamaican","Hitmaker of the roots era.","A major producer whose studio, with engineer Errol Thompson, turned out era-defining roots and the African Dub series.",[["1978","African Dub All-Mighty Chapter 3",""]]),

let mbLast=0;
function mbFetch(url){const wait=Math.max(0,1100-(Date.now()-mbLast));return new Promise((res,rej)=>setTimeout(()=>{mbLast=Date.now();fetch(url).then(r=>{if(!r.ok)throw new Error("http "+r.status);return r.json();}).then(res,rej);},wait));}

}

/* ----------  AMBIENT SOUND (synthesized)  ---------- */
function initAudio(){
  if(actx)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  actx=new AC();
  masterGain=actx.createGain();masterGain.gain.value=0;masterGain.connect(actx.destination);
  const n=Math.floor(actx.sampleRate*2),buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
  let last=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3;}
  const noise=actx.createBufferSource();noise.buffer=buf;noise.loop=true;
  whooshFilter=actx.createBiquadFilter();whooshFilter.type="bandpass";whooshFilter.frequency.value=500;whooshFilter.Q.value=0.6;
  whooshGain=actx.createGain();whooshGain.gain.value=0;
  noise.connect(whooshFilter);whooshFilter.connect(whooshGain);whooshGain.connect(masterGain);noise.start();
}
function ensureWhoosh(){
  if(audioAutoStarted)return;audioAutoStarted=true;
  initAudio();if(!actx)return;
  if(actx.state==="suspended")actx.resume();
  soundOn=true;
  const t=actx.currentTime;masterGain.gain.cancelScheduledValues(t);masterGain.gain.setValueAtTime(masterGain.gain.value,t);masterGain.gain.linearRampToValueAtTime(0.5,t+0.4);
  const sb=document.getElementById("soundBtn");if(sb){sb.classList.add("on");sb.textContent="Sound ◉";}
}
function ping(freq){
  if(!actx||!soundOn||!masterGain)return;
  const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=freq||440;
  o.connect(g);g.connect(masterGain);const t=actx.currentTime;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.1,t+0.012);g.gain.exponentialRampToValueAtTime(0.0008,t+0.9);
  o.start(t);o.stop(t+0.95);
}
const soundBtn=document.getElementById("soundBtn");
if(soundBtn)soundBtn.onclick=()=>{
  initAudio();if(!actx)return;
  if(actx.state==="suspended")actx.resume();
  soundOn=!soundOn;
  soundBtn.classList.toggle("on",soundOn);
  soundBtn.textContent=soundOn?"Sound ◉":"Sound";
  const t=actx.currentTime;masterGain.gain.cancelScheduledValues(t);masterGain.gain.setValueAtTime(masterGain.gain.value,t);masterGain.gain.linearRampToValueAtTime(soundOn?0.5:0,t+0.6);
};

function jsonpLookup(term,cb){
  if(typeof document==="undefined"||!document.body){cb(null);return;}
  const id="itcb"+(Math.random()*1e9|0);let done=false;
  const s=document.createElement("script");
  function cleanup(){try{delete window[id];}catch(e){window[id]=undefined;}if(s.parentNode)s.parentNode.removeChild(s);}
  window[id]=data=>{if(done)return;done=true;cleanup();const r=((data&&data.results)||[]).find(x=>x.previewUrl);cb(r?r.previewUrl:"none");};
  s.onerror=()=>{if(!done){done=true;cleanup();cb(null);}};
  s.src="https://itunes.apple.com/search?term="+encodeURIComponent(term)+"&media=music&entity=song&attribute=artistTerm&limit=4&callback="+id;
  document.body.appendChild(s);
  setTimeout(()=>{if(!done){done=true;cleanup();cb(null);}},6500);
}

/* Verified previews: only play a clip whose artist actually matches the star.
   pnorm() normalises names so "Lee \"Scratch\" Perry" == "lee scratch perry", etc. */
function pnorm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/&/g," and ").replace(/\bthe\b/g," ").replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();}
function artistMatch(a,b){a=pnorm(a);b=pnorm(b);return !!a&&!!b&&a===b;}
function jsonp(url,cb){if(typeof document==="undefined"||!document.body){cb(null);return;}const id="jp"+(Math.random()*1e9|0);let done=false;const s=document.createElement("script");const fin=v=>{if(done)return;done=true;try{delete window[id];}catch(e){window[id]=undefined;}if(s.parentNode)s.parentNode.removeChild(s);cb(v);};window[id]=d=>fin(d);s.onerror=()=>fin(null);s.src=url+(url.indexOf("?")<0?"?":"&")+"output=jsonp&callback="+id;document.body.appendChild(s);setTimeout(()=>fin(null),6500);}

function itSearch(term,want,cb){let done=false;const fin=v=>{if(done)return;done=true;cb(v);};setTimeout(()=>fin(null),12000);const u="https://itunes.apple.com/search?term="+encodeURIComponent(term)+"&media=music&entity=song&limit=12";const match=res=>{const r=(res||[]).find(x=>x.previewUrl&&artistMatch(x.artistName,want));fin(r?r.previewUrl:null);};if(typeof fetch==="undefined"){jsonp(u,d=>match(d&&d.results));return;}fetchJSON(u).then(d=>match(d&&d.results)).catch(()=>jsonp(u,d=>match(d&&d.results)));}

function playClip(nd){
  if(!clip)return;
  clipFor=nd.id;
  let cached=null;try{cached=localStorage.getItem("jc_clip2_"+nd.id);}catch(e){}
  if(cached){if(cached!=="none")playPreview(cached,nd.name);else clipNote("No verified preview for "+nd.name);return;}
  clipNote("♪  finding "+nd.name+"…",6500);
  const ov=PREVIEW[nd.id]||{}, want=ov.artist||nd.name;
  const seed=(nd.disco&&nd.disco[0]&&nd.disco[0][1])||"";
  const q1=ov.q||(seed&&!/^with /i.test(seed)?nd.name+" "+seed:nd.name);
  const q2=nd.name;
  const done=url=>{if(clipFor!==nd.id)return;try{localStorage.setItem("jc_clip2_"+nd.id,url||"none");}catch(e){}if(url)playPreview(url,nd.name);else clipNote("No verified preview for "+nd.name);};
  const search=(q,next)=>dzSearch(q,arr=>{if(clipFor!==nd.id)return;const t=(arr||[]).find(x=>x&&x.preview&&artistMatch(x.artist&&x.artist.name,want));if(t)done(t.preview);else next();});
  const itun=()=>itSearch(q2,want,url=>{if(clipFor!==nd.id)return;done(url);});

  else search(q1,()=>q1!==q2?search(q2,itun):itun());
}
